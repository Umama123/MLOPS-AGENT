name: MLOps AI Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic fastapi uvicorn scikit-learn pandas mlflow dvc kubernetes requests

      - name: Verify project structure
        run: |
          test -f agent/orchestrator.py
          test -f dags/training_pipeline.py
          test -f kubernetes/deployment.yaml
          test -f Dockerfile
          test -f dvc.yaml

      - name: Run automated pytest suite
        run: |
          pytest -v